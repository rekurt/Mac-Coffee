name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned tools
        run: brew bundle

      - name: Generate project
        run: xcodegen generate

      - name: Unit tests
        run: >-
          xcodebuild test
          -project MacCoffee.xcodeproj
          -scheme MacCoffeeTests
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Build Direct target
        run: ./scripts/build-local.sh direct

      - name: Build App Store target
        run: ./scripts/build-local.sh app-store

      - name: Verify distribution boundary
        run: ./scripts/verify-bundles.sh

      - name: Package local smoke-test DMG
        run: ./scripts/package-dmg.sh
