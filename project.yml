name: MacCoffee

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "13.0"
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "6.0"
    ARCHS: "$(ARCHS_STANDARD)"
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic

targets:
  MacCoffeeCore:
    type: framework
    platform: macOS
    sources:
      - Sources/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rekurt.maccoffee.core
        PRODUCT_NAME: MacCoffeeCore
        GENERATE_INFOPLIST_FILE: YES

  MacCoffeeDirect:
    type: application
    platform: macOS
    sources:
      - Sources/Direct
      - Sources/MCPBrokerShared
      - path: Resources/Shared
        buildPhase: resources
      - path: Resources/Direct
        excludes:
          - Info.plist
        buildPhase: resources
    dependencies:
      - target: MacCoffeeCore
      - target: MacCoffeeMCPBroker
        embed: true
      - package: Sparkle
    configFiles:
      Debug: Config/Direct.xcconfig
      Release: Config/Direct.xcconfig

  MacCoffeeAppStore:
    type: application
    platform: macOS
    sources:
      - Sources/AppStore
      - path: Resources/Shared
        buildPhase: resources
      - path: Resources/AppStore
        excludes:
          - Info.plist
        buildPhase: resources
    dependencies:
      - target: MacCoffeeCore
    configFiles:
      Debug: Config/AppStore.xcconfig
      Release: Config/AppStore.xcconfig

  MacCoffeeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/Unit
      - Tests/Support
      - Sources/Direct/Security/KeychainMCPCredentialStore.swift
      - Sources/Direct/Security/SecurityClientIdentityVerifier.swift
      - Sources/MCPHelper/Security/KeychainClientKeyStore.swift
      - Sources/MCPHelper/Security/ParentProcessIdentity.swift
    dependencies:
      - target: MacCoffeeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rekurt.maccoffee.tests
        GENERATE_INFOPLIST_FILE: YES

  MacCoffeeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/UI
    dependencies:
      - target: MacCoffeeDirect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rekurt.maccoffee.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MacCoffeeDirect

  MacCoffeeIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/Integration
      - Tests/Support
      - Sources/Direct/MCP
      - Sources/MCPHelper/XPC
      - Sources/MCPBrokerShared
      - path: Sources/MCPBroker
        excludes:
          - main.swift
    dependencies:
      - target: MacCoffeeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rekurt.maccoffee.integration-tests
        GENERATE_INFOPLIST_FILE: YES

  MacCoffeeMCPBroker:
    type: xpc-service
    platform: macOS
    sources:
      - Sources/MCPBroker
      - Sources/MCPBrokerShared
    info:
      path: Resources/MCPBroker/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rekurt.maccoffee.mcp-broker
        PRODUCT_NAME: MacCoffeeMCPBroker
        SKIP_INSTALL: YES

  MacCoffeeScreenshots:
    type: application
    platform: macOS
    sources:
      - Tools/Screenshots
      - path: Resources/Shared
        buildPhase: resources
    dependencies:
      - target: MacCoffeeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rekurt.maccoffee.screenshots
        PRODUCT_NAME: MacCoffeeScreenshots
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  MacCoffeeDirect:
    build:
      targets:
        MacCoffeeDirect: all
    run:
      config: Debug
    archive:
      config: Release

  MacCoffeeAppStore:
    build:
      targets:
        MacCoffeeAppStore: all
    run:
      config: Debug
    archive:
      config: Release

  MacCoffeeTests:
    build:
      targets:
        MacCoffeeCore: all
        MacCoffeeTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MacCoffeeTests

  MacCoffeeUITests:
    build:
      targets:
        MacCoffeeDirect: all
        MacCoffeeAppStore: all
        MacCoffeeUITests: [test]
    test:
      config: Debug
      macroExpansion: MacCoffeeDirect
      targets:
        - MacCoffeeUITests

  MacCoffeeIntegrationTests:
    build:
      targets:
        MacCoffeeCore: all
        MacCoffeeIntegrationTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MacCoffeeIntegrationTests

  MacCoffeeScreenshots:
    build:
      targets:
        MacCoffeeScreenshots: all
    run:
      config: Release
